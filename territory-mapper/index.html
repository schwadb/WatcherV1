<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a73e8" />
    <meta name="description" content="Territory & pin mapping for the US. Import a spreadsheet, paint territories, work offline, export print-ready maps." />
    <title>Territory Mapper</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2V6z" stroke="#1a73e8" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="12" cy="10" r="2.4" fill="#e15759"/>
          </svg>
          <span>Territory Mapper</span>
        </div>
        <input id="project-name" class="project-name" spellcheck="false" aria-label="Project name" />
        <span id="save-dot" class="save-dot" title="Saved">●</span>
        <div class="spacer"></div>
        <span id="net-status" class="net-status" hidden>offline</span>
        <button id="btn-export" class="btn primary">Export</button>
      </header>

      <div id="body">
        <nav id="tabs">
          <button data-tab="territories" class="tab active">Territories</button>
          <button data-tab="data" class="tab">Data</button>
          <button data-tab="offline" class="tab">Offline</button>
          <button data-tab="project" class="tab">Project</button>
        </nav>

        <aside id="sidebar">
          <section id="panel-territories" class="panel active"></section>
          <section id="panel-data" class="panel"></section>
          <section id="panel-offline" class="panel"></section>
          <section id="panel-project" class="panel"></section>
        </aside>

        <main id="map-wrap">
          <div id="map"></div>
          <div id="legend" class="legend" hidden></div>
          <div id="toast" class="toast" hidden></div>
        </main>
      </div>
    </div>

    <dialog id="modal"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
