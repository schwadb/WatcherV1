# Watcher Dashboard settings (no secrets here; secrets go in .env)
# Easiest way to change these: open http://dashboard.local:8080/manage on your phone.
# If you edit this file by hand on the Pi: sudo systemctl restart dashboard

location:
  name: "Plymouth, NE"        # shown in the weather panel
  lat: 40.3039                # ZIP 68424
  lon: -97.0012
  timezone: "America/Chicago" # IANA time zone name

units: imperial               # imperial = °F / mph, metric = °C / km/h
clock_24h: false

# Show or hide whole panels. Hidden panels give their space to their neighbors.
panels:
  alerts: true                # severe weather banner
  radar: true
  stocks: true
  sports: true
  calendar: true
  todo: true
  news: true
  photos: true
  nowplaying: true

weather:
  refresh_minutes: 10
  forecast_days: 5            # days shown after today
  hourly_hours: 8             # hours in the hourly strip
  air_quality: true           # US air quality index from Open-Meteo
  alerts: true                # National Weather Service watches and warnings (US only)
  alerts_refresh_minutes: 5

radar:
  provider: rainviewer        # rainviewer (default) or mesonet (US NEXRAD fallback)
  refresh_minutes: 5
  zoom: 6                     # 5 = several states, 7 = max detail RainViewer offers
  frame_ms: 600               # time each radar frame is shown
  # Dark map tiles under the radar (free, no key). Set labels: "" to hide city names and borders.
  basemap: "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}"
  labels: "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}"

stocks:
  symbols:                    # Finnhub free tier has no index quotes, so use ETFs
    SPY: "S&P 500"
    DIA: "Dow Jones"
    QQQ: "Nasdaq 100"
  refresh_minutes_open: 2     # during US market hours
  refresh_minutes_closed: 15

# Calendars: any number of ICS links, each with its own color.
# "${NAME}" reads the link from .env, so secrets stay out of this file.
calendars:
  - name: Work
    url: "${OUTLOOK_ICS_URL}"
    color: "#5aa9ff"
  # - name: Family
  #   url: "${FAMILY_ICS_URL}"
  #   color: "#f5b942"

calendar:
  days_ahead: 7               # today + this many days
  refresh_minutes: 15
  max_events: 9

# Countdown chips in the clock panel ("N days"). Past dates disappear by themselves.
countdowns:
  - title: Halloween
    date: 2026-10-31
    icon: "🎃"
  - title: Thanksgiving
    date: 2026-11-26
    icon: "🦃"
  - title: Christmas
    date: 2026-12-25
    icon: "🎄"

# Favorite team tile (ESPN). team = ESPN team id or abbreviation.
# Find other teams with: .venv/bin/python tools/find_team.py "kansas city"
sports:
  refresh_minutes: 10
  teams:
    - sport: football
      league: college-football
      team: 158               # Nebraska Cornhuskers

news:
  refresh_minutes: 10
  max_headlines: 40
  feeds:
    - name: NPR
      url: "https://feeds.npr.org/1001/rss.xml"
    - name: BBC
      url: "https://feeds.bbci.co.uk/news/world/rss.xml"
    - name: CBS
      url: "https://www.cbsnews.com/latest/rss/main"

photos:
  folder: "photos"            # relative to the dashboard folder, or an absolute path
  seconds_per_photo: 20
  order: shuffle              # shuffle or name
  rescan_minutes: 5
  max_size: 1920              # longest edge after resizing, in pixels
  max_upload_mb: 25           # per photo, for uploads from the manage page

todo:
  max_items: 8                # shown on the dashboard

now_playing:
  provider: "off"             # off | spotify
  refresh_seconds: 10

display:
  reload_at: "03:30"          # daily browser reload (keeps Chromium's memory in check)
  screen_off: ""              # e.g. "23:00" turns the TV off; "" = never
  screen_on: ""               # e.g. "06:00"
  dim_from: ""                # e.g. "21:30" dims the page until screen_on
  dim_level: 0.5              # 0 = no dimming, 0.9 = very dark
  control: auto               # auto = switch the HDMI output on/off; off = only dim the page

server:
  host: "0.0.0.0"
  port: 8080
