<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watcher Dashboard</title>
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main class="board">

  <section class="panel clock" data-widget="clock">
    <div class="main">
      <div class="time"><span id="clock-time">--:--</span><span id="clock-ampm" class="ampm"></span></div>
      <div id="clock-date" class="date">&nbsp;</div>
    </div>
    <div class="countdowns hidden" id="countdowns"></div>
  </section>

  <section class="panel photo" data-widget="photos">
    <img id="photo-a" class="layer" alt="">
    <img id="photo-b" class="layer" alt="">
    <div id="photo-empty" class="empty hidden">Add photos to the photo folder on the Pi to start the slideshow.</div>
    <div id="alert-banner" class="alert hidden" role="alert">
      <div class="alert-event" id="alert-event"></div>
      <div class="alert-text" id="alert-text"></div>
      <div class="alert-until" id="alert-until"></div>
    </div>
    <div id="now-playing" class="now-playing hidden">
      <img id="np-art" alt="">
      <div class="np-text"><div class="np-title" id="np-title"></div><div class="np-artist" id="np-artist"></div><div class="np-bar"><div id="np-progress"></div></div></div>
    </div>
    <span class="badge" id="badge-photos"></span>
    <span class="badge alerts-badge" id="badge-alerts"></span>
  </section>

  <section class="panel weather" data-widget="weather">
    <header><h2 id="weather-place">Weather</h2><span class="badge" id="badge-weather"></span></header>
    <div class="now">
      <div class="now-icon" id="weather-icon"></div>
      <div class="now-temp"><span id="weather-temp">--</span><span class="deg" id="weather-unit">°</span></div>
      <div class="now-text">
        <div class="now-label" id="weather-label">&nbsp;</div>
        <div class="now-detail" id="weather-detail">&nbsp;</div>
      </div>
    </div>
    <div class="today-line" id="weather-today">&nbsp;</div>
    <div class="chips" id="weather-chips"></div>
    <ul class="hourly" id="hourly"></ul>
    <ul class="forecast" id="forecast"></ul>
  </section>

  <section class="panel calendar" data-widget="calendar">
    <header><h2>Calendar</h2><span class="legend" id="cal-legend"></span><span class="badge" id="badge-calendar"></span></header>
    <div class="agenda" id="agenda"><div class="muted">Loading…</div></div>
  </section>

  <section class="panel todo" data-widget="todo">
    <header><h2>To-do</h2><span class="badge" id="badge-todo"></span></header>
    <ul class="todo-list" id="todo-list"></ul>
    <div class="notes hidden" id="notes"></div>
  </section>

  <section class="panel stocks" data-widget="stocks">
    <header><h2 id="markets-title">Markets</h2><span class="market" id="market-state"></span><span class="badge" id="badge-stocks"></span><span class="badge sports-badge" id="badge-sports"></span></header>
    <div class="tiles">
      <div class="quotes" id="quotes"><div class="muted">Loading…</div></div>
      <div class="tile sports hidden" id="sports"></div>
    </div>
  </section>

  <section class="panel radar" data-widget="radar">
    <div id="map"></div>
    <div class="radar-time" id="radar-time"></div>
    <div class="radar-attrib" id="radar-attrib"></div>
    <span class="badge" id="badge-radar"></span>
  </section>

  <section class="panel ticker" data-widget="news">
    <div class="ticker-label">NEWS</div>
    <div class="ticker-viewport"><div class="ticker-track" id="ticker-track"></div></div>
    <span class="badge" id="badge-news"></span>
  </section>

</main>
<div id="dim-overlay"></div>
<div id="setup-note" class="setup-note hidden"></div>
<div class="corner-buttons">
  <button id="desktop-btn" class="corner" type="button" title="Use the Pi as a computer (D)">&#128421; Desktop</button>
  <a id="gear" class="corner" href="/manage?kiosk=1" title="Settings (S)">&#9881; Settings</a>
</div>
<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/icons.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
